<header>
  <section class="logo-title-list" (click)="returnHome()">
    <figure>
      <img src="assets/images/logo.png" alt="logo de la empresa" class="logo">
    </figure>
    <h1 class="sigmar-one-regular" id="title"><a>Funko Store</a></h1>
  </section>

  <form class="search-container" (submit)="onSearch(); $event.preventDefault()">
    <button type="button" id="filter-button" (click)="toggleFilter()">
      <img src="assets/images/filter.png" alt="Filtrar" class="filter-icon">
    </button>
    <label>
      <input type="text" id="searchInput" placeholder="Buscar figuras..."
             [(ngModel)]="searchTerm" name="searchTerm">
    </label>
    <button type="submit" id="search-button">
      <img src="assets/images/search.png" alt="buscar" class="search-icon">
    </button>
  </form>

  <section class="button-list">
    <ng-container *ngIf="!currentUser; else User">
      <a class="signed-out-button" id="sign_up" (click)="goToSignUpPage()">Sign up</a>
      <a class="signed-out-button" id="sign_in" (click)="goToSignInPage()">Sign in</a>
    </ng-container>
    <ng-template #User>
      <section class="dropdown-container">
        <a class="signed-in-button" id="user-options-button" (click)="toggleProfileDropdown()">
          <img [src]="profileImageURL || 'assets/images/profile.png'" alt="Opciones de usuario" class="profile-icon"/>
        </a>
        <app-profile-dropdown *ngIf="profileDropdownService.isVisible$ | async"></app-profile-dropdown>
      </section>
      <button class="signed-in-button" id="cart-button" (click)="toggleCart()">
        <img src="assets/images/shopping-cart.png" alt="Cart" class="cart-icon">
      </button>
    </ng-template>
  </section>
</header>
