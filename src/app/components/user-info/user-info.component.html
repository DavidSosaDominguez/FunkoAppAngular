<main>
  <h1 id="profile-greeting">Hello! username</h1>
  <form id="user-form">
    <section id="picture-selector">
      <img id="current-user-picture" src="assets/images/profile.png" alt="user picture"/>
      <input
        type="file"
        accept="image/*"
        name="picture"
        id="user-picture"
        hidden
      />
      <button id="select-picture-button">Select profile picture from PC</button>
    </section>
    <section id="text-values">
      <label for="user-email">Email</label>
      <input type="email" id="user-email" value="current-value" name="email"/>
      <label for="user-name">Name</label>
      <input type="text" id="user-name" value="current-value" name="name"/>
      <label for="user-surname">Surname</label>
      <input type="text" id="user-surname" value="current-value" name="surname" />
    </section>
    <button type="submit" id="submit-user-form">Submit</button>
  </form>
</main>
