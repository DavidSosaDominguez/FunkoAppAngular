<main>
  <section id="loading_indicator" *ngIf="loading">
    <p>Cargando productos...</p>
  </section>

  <section id="error_message" *ngIf="errorMessage">
    <p>{{ errorMessage }}</p>
  </section>

  <section id="product_list_container" *ngIf="!loading && !errorMessage">
    <app-product *ngFor="let funko of funkos" class="product_holder"
      [funko] = "funko">
    </app-product>
  </section>
</main>
