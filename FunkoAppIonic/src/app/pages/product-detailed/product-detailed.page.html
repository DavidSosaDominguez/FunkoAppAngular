<ion-header>
  <ion-toolbar>
    <app-header></app-header>
  </ion-toolbar>
</ion-header>

<ion-content>
    <ion-card>
        <app-shopping-resume></app-shopping-resume>

        <p *ngIf="loading">Cargando producto...</p>
        <p *ngIf="error">Error al cargar el producto</p>

        <article *ngIf="funko && !loading && !error" id="product_display">
            <section class="product_sections">
                <figure id="product_image_container">
                    <img id="product_image" [src]="funko.image" [alt]="funko.name" />
                    <figcaption id="product_quantity">Available: {{funko.quantity}}</figcaption>
                </figure>
            </section>

            <section id="product_info" class="product_sections">
                <section id="product_def_container">
                    <section class="title_and_favorite">
                        <h1 id="product_title">{{ funko.name }}</h1>
                        <ng-container *ngIf="currentUser">
                            <button class="toggle-favorite_button" (click)="toggleFavorite()">
                                <img
                                        [src]="isFavorite() ? 'assets/images/favorite.png' : 'assets/images/not-favorite.png'"
                                        alt="Toggle favorite" />
                            </button>
                        </ng-container>
                    </section>
                    <h2 id="category_text">{{ funko.series }}</h2>
                </section>
                <p id="product_description">{{ funko.description }}</p>
                <p id="product_price">{{ funko.price }}€</p>

                <button
                        type="button"
                        id="buy_button"
                        (click)="currentUser ? addToCart() : goToSignIn()">
                    Add to Cart
                </button>
            </section>
        </article>

        <p *ngIf="!funko && !loading && !error">Product not found.</p>

        <aside>
            <h2 id="related_products_text">It may interest you...</h2>

            <p *ngIf="loadingRelated">Loading related products...</p>

            <nav *ngIf="!loadingRelated && relatedFunkos.length > 0" id="related_items_container">
                <section
                        class="related_product_item"
                        *ngFor="let funko of relatedFunkos; trackBy: trackByFunkoId"
                        (click)="viewProductDetailed(funko.id)">
                    <img class="related_images" [src]="funko.image" [alt]="funko.name" />
                    <p class="related_products_text">{{ funko.name }}</p>
                </section>
            </nav>
        </aside>
    </ion-card>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <app-footer></app-footer>
  </ion-toolbar>
</ion-footer>
