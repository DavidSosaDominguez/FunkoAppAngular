<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>product-list</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <main>
    <section id="product_list_container" *ngIf="!loading && !errorMessage">
      <app-product *ngFor="let funko of filteredFunkos" class="product_holder"
                   [funko] = "funko">
      </app-product>
    </section>
  </main>
</ion-content>
