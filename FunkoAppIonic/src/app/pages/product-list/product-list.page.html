<ion-header>
    <app-header></app-header>
</ion-header>

<ion-content>
    <ion-card id="product_list_container" *ngIf="!loading && !errorMessage">
      <app-product *ngFor="let funko of filteredFunkos" class="product_holder"
                   [funko] = "funko">
      </app-product>
    </ion-card>

  <ion-footer>
    <app-footer></app-footer>
  </ion-footer>
</ion-content>
