<ion-header>
    <app-header></app-header>
</ion-header>

<ion-content [fullscreen]="true">
    <ion-card id="register_box">
        <h1 id="register_text">Sign In</h1>
        <form class="input_form" id="login_form" [formGroup]="form" (ngSubmit)="onSubmit()">
            <ion-input id="email" type="email" placeholder="Email*" formControlName="email"></ion-input>
            <ion-input id="password" type="password" placeholder="Password*" formControlName="password"></ion-input>
            <ion-button type="submit" id="submit_button" expand="block">Submit</ion-button>
        </form>
    </ion-card>

    <ion-card id="register_link">
        <button type="button" id="signup_link" (click)="goToSignUpPage()">
            <a>New to the shop? Register here</a>
        </button>
    </ion-card>
</ion-content>

<ion-footer>
    <app-footer></app-footer>
</ion-footer>
