<section class="shopping-resume" *ngIf="isVisible$ | async">
  <header class="cart-header">
    <h2>Your Cart</h2>
  </header>

  <main class="cart-items" *ngIf="cartItems$ | async as cartItems">
    <div *ngIf="cartItems.length === 0" class="empty-cart">
      <p>Your cart is empty</p>
    </div>

    <article class="cart-item" *ngFor="let item of cartItems">
      <img [src]="item.image" [alt]="item.name" class="product-image">

      <section class="product-info">
        <h3>{{ item.name }}</h3>
        <p class="price">{{ item.price | currency:'EUR' }}</p>
      </section>

      <section class="quantity-control">
        <button (click)="decreaseQuantity(item)" class="quantity-btn">-</button>
        <input type="number"
               [value]="item.quantity || 1"
               (change)="updateQuantityManually(item, $event)"
               min="1"
               class="quantity-input">
        <button (click)="increaseQuantity(item)" class="quantity-btn">+</button>
      </section>

      <button (click)="removeProduct(item.id)" class="remove-btn">
        Eliminar
      </button>
    </article>

    <footer class="cart-footer" *ngIf="cartItems.length > 0">
      <section class="total-section">
        <span>Total:</span>
        <span class="total-amount">{{ totalAmount$ | async | currency:'EUR' }}</span>
      </section>
      <button (click)="reserve()" class="checkout-btn">Proceder al Pago</button>
    </footer>
  </main>
</section>
