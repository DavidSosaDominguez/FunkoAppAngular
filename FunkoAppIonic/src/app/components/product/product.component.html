<section class="product_info">
  <img class="product_image" [src]="funko.image" [alt]="funko.name" />
  <section class="funko_details">
    <ng-container *ngIf="currentUser; else noUser">
    <h2 class="product_name">{{ funko.name}}
      <button class="toggle-favorite_button" (click)="toggleFavorite()">
        <img [src]="isFavorite() ? 'assets/images/favorite.png' : 'assets/images/not-favorite.png'" alt="Toggle favorite" />
      </button>
    </h2>
    </ng-container>
    <ng-template #noUser>
      <h2 class="product_name">{{ funko.name}}</h2>
    </ng-template>
    <h3 class="product_description">{{ funko.series }}</h3>
    <button (click)="funko.id ? viewProductDetailed() : null" class="product_button">View</button>        </section>
</section>
<p class="product_price">{{ funko.price }}€</p>
